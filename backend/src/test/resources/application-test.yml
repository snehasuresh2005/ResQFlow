spring:
  datasource:
    url: jdbc:h2:mem:resqflow_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false
  kafka:
    listener:
      auto-startup: false
management:
  health:
    redis:
      enabled: false
    kafka:
      enabled: false
logging:
  level:
    root: WARN
    com.resqflow: INFO

